<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="sorted_combos.js"></script>
    <script src="script.js" defer></script>
    <title>Web As Artwork</title>
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="hint">Drag a word into the canvas →</div>
        
        <!-- 游戏目标区域 -->
        <div class="game-target">
            <div class="target-label">Target:</div>
            <div class="target-word" id="targetWord">forest</div>
            <div class="score">Score: <span id="score">0</span></div>
        </div>
        
        <div class="chip" data-word="fire">fire</div>
        <div class="chip" data-word="water">water</div>
        <div class="chip" data-word="earth">earth</div>
        <div class="chip" data-word="plant">plant</div>
        <div class="chip" data-word="air">air</div>
      </aside>
    
      <main class="stage" id="stage" aria-label="canvas for merging"></main>

</body>
</html>
